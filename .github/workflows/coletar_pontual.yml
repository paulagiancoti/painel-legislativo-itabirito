name: Coletar oradores (pontual)

on:
  workflow_dispatch:   # apenas manual

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# Mesmo grupo do "Atualizar dados SAPL": se a atualização diária estiver
# rodando, esta espera ela terminar (e vice-versa) — evita conflito no push.
concurrency:
  group: atualizar-dados-sapl
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Garantir que estamos no main mais recente
        run: git pull --ff-only origin main

      - name: Rodar coleta pontual de oradores
        run: python coletar_pontual.py

      - name: Commitar oradores
        # "always()": se a coleta ficou incompleta, o script já mesclou só o
        # que chegou (sem perder nada) — vale salvar esse avanço. O job
        # continua marcado como falho nesse caso, para você rodar de novo.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/oradores.json dados/ultima_atualizacao.json || true
          git diff --staged --quiet || git commit -m "Coleta pontual: oradores"
          git pull --rebase origin main
          git push
